<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>XLibrary Account Deletion Request</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #061a2b;
            --panel: #082338;
            --border: #123a58;
            --text: #e8f2fb;
            --muted: #9fb2c3;
            --accent: #7fc7ff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.7;
        }

        main {
            width: min(880px, calc(100% - 32px));
            margin: 0 auto;
            padding: 40px 0;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        h1 {
            margin: 0;
            font-size: 28px;
            line-height: 1.25;
        }

        .summary {
            margin: 12px auto 0;
            max-width: 720px;
            color: var(--muted);
            font-size: 15px;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 24px;
            font-size: 15px;
        }

        h2 {
            margin: 0 0 14px;
            font-size: 20px;
            line-height: 1.35;
        }

        p {
            margin: 0 0 16px;
        }

        ul {
            margin: 0 0 18px;
            padding-left: 22px;
        }

        a {
            color: var(--accent);
            font-weight: 700;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .email {
            display: inline-block;
            margin: 4px 0 18px;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: rgba(127, 199, 255, 0.08);
        }

        .note {
            color: var(--muted);
            font-size: 14px;
        }
